name: OneScript и yard
description: Ставит OneScript из архива и yard для загрузки дистрибутивов с releases.1c.ru

inputs:
  onescript-version:
    description: Версия OneScript
    default: '2.1.0'
  onescript-sha256:
    description: SHA-256 архива OneScript для Linux
    default: '548dfaff7a389e7c64b7e60ca26c7e4b086de83fe3b67f4b9059bb036f8508fc'
  yard-version:
    description: Версия yard
    default: '1.14.0'

runs:
  using: composite
  steps:
    - name: Установить OneScript и yard
      shell: bash
      env:
        ONESCRIPT_VERSION: ${{ inputs.onescript-version }}
        ONESCRIPT_SHA256: ${{ inputs.onescript-sha256 }}
        YARD_VERSION: ${{ inputs.yard-version }}
        LANG: C.UTF-8
      run: |
        home="$RUNNER_TEMP/onescript"
        curl -fsSL -o "$RUNNER_TEMP/onescript.zip" \
          "https://oscript.io/downloads/${ONESCRIPT_VERSION//./_}/OneScript-${ONESCRIPT_VERSION}-linux-x64.zip"
        echo "$ONESCRIPT_SHA256  $RUNNER_TEMP/onescript.zip" | sha256sum -c -
        mkdir -p "$home"
        unzip -q "$RUNNER_TEMP/onescript.zip" -d "$home"
        rm "$RUNNER_TEMP/onescript.zip"
        chmod +x "$home/bin/oscript" "$home/bin/opm" "$home/bin/createdump"
        export PATH="$home/bin:$PATH" OSCRIPTBIN="$home/bin"
        echo "$home/bin" >> "$GITHUB_PATH"
        # Хаб пакетов иногда не отвечает
        for try in 1 2 3; do
          if timeout 600 opm install "yard@$YARD_VERSION"; then
            break
          fi
          [ "$try" = 3 ] && { echo "::error::yard не установился"; exit 1; }
          sleep 30
        done
        yard --version

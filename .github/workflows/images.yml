name: Образы

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа: линейки или версии через пробел ("8.3.27 8.5.1.1529"); пусто - из versions.json; "-" - не собирать'
        required: false
        default: ''
      edt:
        description: '1C:EDT: линейки или версии через пробел ("2026.1"); пусто - из versions.json; "-" - не собирать'
        required: false
        default: ''
      tools:
        description: 'Собрать onescript и downloader'
        type: boolean
        default: false
      publish:
        description: 'Опубликовать в ghcr.io'
        type: boolean
        default: true
      new_only:
        description: 'Только новые сборки: версии, которые уже опубликованы, пропустить'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'vnc/**'
      - 'onescript/**'
      - 'downloader/**'
      - 'vrunner/**'
      - 'edt/**'
      - 'scripts/**'
      - 'tests/smoke.sh'
      - 'tests/fixtures/**'
      - 'versions.json'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'client/**'
      - 'vnc/**'
      - 'onescript/**'
      - 'downloader/**'
      - 'vrunner/**'
      - 'edt/**'
      - 'scripts/**'
      - 'tests/smoke.sh'
      - 'tests/fixtures/**'
      - 'versions.json'
      - '.github/workflows/images.yml'

permissions: {}

concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && github.run_id || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: План
    # Без секретов организации дистрибутивы не скачать: запросы из форков не собираются
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      tools: ${{ steps.plan.outputs.tools }}
      platform: ${{ steps.plan.outputs.platform }}
      edt: ${{ steps.plan.outputs.edt }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Собрать загрузчик
        run: |
          docker build -q -t 1c-nest-build/onescript onescript
          docker build -q --build-arg BASE_IMAGE=1c-nest-build/onescript -t 1c-nest-build/downloader downloader

      - name: Войти в ghcr.io
        if: github.event_name == 'schedule' || inputs.new_only
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Выбрать кубики и версии
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PLATFORM: ${{ inputs.platform }}
          EDT: ${{ inputs.edt }}
          TOOLS: ${{ inputs.tools }}
          PUBLISH: ${{ inputs.publish }}
          NEW_ONLY: ${{ inputs.new_only }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          DOWNLOADER_IMAGE: 1c-nest-build/downloader
          ONEC_LOGIN: ${{ secrets.ONEC_LOGIN }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        run: bash scripts/plan.sh

  tools:
    name: OneScript и загрузчик
    needs: plan
    if: needs.plan.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Параметры образов
        run: |
          {
            echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "IMAGE_REVISION=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Собрать образы
        run: |
          bash scripts/build.sh tools > "$RUNNER_TEMP/images"
          docker image ls "$IMAGE_PREFIX/*"

      - name: Проверить образы
        env:
          ONEC_LOGIN: ${{ secrets.ONEC_LOGIN }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        run: bash tests/smoke.sh "$RUNNER_TEMP/images"

      - name: Войти в ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать
        if: env.PUBLISH == 'true'
        run: bash scripts/publish.sh "$RUNNER_TEMP/images"

  platform:
    name: Платформа ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.platform != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platform) }}
    env:
      VERSION: ${{ matrix.version }}
      LINE: ${{ matrix.line }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Параметры образов
        run: |
          {
            echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "IMAGE_REVISION=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          df -h /

      # Неизменённые образы, на которых строятся изменённые, берутся из реестра
      - name: Войти в ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать образы
        env:
          CHANGED: ${{ needs.plan.outputs.changed }}
          ONEC_LOGIN: ${{ secrets.ONEC_LOGIN }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        run: |
          bash scripts/build.sh platform "$VERSION" > "$RUNNER_TEMP/images"
          docker builder prune -af > /dev/null
          docker image ls "$IMAGE_PREFIX/*"
          while read -r image; do
            echo "$image: самый большой слой $(docker history --format '{{.Size}}' "$image" | sort -h | tail -1)"
          done < "$RUNNER_TEMP/images"
          df -h /

      - name: Проверить образы
        run: bash tests/smoke.sh "$RUNNER_TEMP/images"

      - name: Опубликовать
        if: env.PUBLISH == 'true'
        run: bash scripts/publish.sh "$RUNNER_TEMP/images" "$VERSION" "$LINE"

  edt:
    name: 1C:EDT ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.edt != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.edt) }}
    env:
      VERSION: ${{ matrix.version }}
      LINE: ${{ matrix.line }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Параметры образов
        run: |
          {
            echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "IMAGE_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "IMAGE_REVISION=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          df -h /

      - name: Собрать образ
        env:
          ONEC_LOGIN: ${{ secrets.ONEC_LOGIN }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        run: |
          bash scripts/build.sh edt "$VERSION" > "$RUNNER_TEMP/images"
          docker builder prune -af > /dev/null
          docker image ls "$IMAGE_PREFIX/*"
          while read -r image; do
            echo "$image: самый большой слой $(docker history --format '{{.Size}}' "$image" | sort -h | tail -1)"
          done < "$RUNNER_TEMP/images"
          df -h /

      - name: Проверить образ
        run: bash tests/smoke.sh "$RUNNER_TEMP/images"

      - name: Войти в ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать
        if: env.PUBLISH == 'true'
        run: bash scripts/publish.sh "$RUNNER_TEMP/images" "$VERSION" "$LINE"
